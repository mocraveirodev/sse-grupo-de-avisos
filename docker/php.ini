; Ajustes de PHP para SSE.

; [Armadilha 1] Sem buffer de saída: cada flush() vai direto pro cliente.
output_buffering = 0
zlib.output_compression = Off

; [Armadilha 4] O padrão (30s) continua valendo para os endpoints comuns;
; o stream.php chama set_time_limit(0) só para ele.
max_execution_time = 30

memory_limit = 128M
date.timezone = ${TZ}
expose_php = Off
